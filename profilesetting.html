<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - Ambulance Booking</title>
  <link rel="stylesheet" href="profile.css" />
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-content">
      <div class="header-left">
        <div class="logo">
          <svg viewBox="0 0 24 24">
            <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1v-1h12v1h1c.55 0 1-.45 1-1v-8l-2.08-5.99z" />
          </svg>
        </div>
        <div class="header-title">
          <h1>My Profile</h1>
          <p>Manage your personal information</p>
        </div>
      </div>
      <button class="back-btn" onclick="window.location.href='customerdashboard.html'">
        ← Back to Dashboard
      </button>
    </div>
  </header>

  <!-- Success Message -->
  <div class="success-message" id="successMessage">
    <svg viewBox="0 0 24 24">
      <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
    </svg>
    <span>Profile updated successfully!</span>
  </div>

  <!-- Container -->
  <div class="container">
    <!-- Profile Card -->
    <div class="profile-card">
      <div class="profile-image-wrapper">
        <div class="profile-image">
          <svg viewBox="0 0 24 24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
          </svg>
        </div>
        <button class="camera-btn">
          <svg viewBox="0 0 24 24">
            <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 
            1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2
            -2h-3.17L15 2H9z" />
          </svg>
        </button>
      </div>
      <h2 class="profile-name" id="profileName">John Doe</h2>
      <p class="profile-email" id="profileEmail">john.doe@email.com</p>

      <div class="stats">
        <div class="stat-item"><span class="stat-label">Total Bookings</span><span class="stat-value">12</span></div>
        <div class="stat-item"><span class="stat-label">Active Trips</span><span class="stat-value">2</span></div>
        <div class="stat-item"><span class="stat-label">Your Rating</span><span class="stat-value">4.8 ★</span></div>
      </div>
      <button class="history-btn">View Booking History</button>
    </div>

    <!-- Details Section -->
    <div class="details-section">
      <!-- Personal Info -->
      <div class="detail-card" id="personalCard">
        <div class="card-header">
          <div class="card-title"><h2>Personal Information</h2></div>
          <div class="button-group" id="personalButtons">
            <button class="edit-btn" onclick="enableEdit('personal')">Edit</button>
          </div>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label>Full Name</label>
            <div class="input-wrapper"><input type="text" id="fullName" value="John Doe" disabled></div>
          </div>
          <div class="form-group">
            <label>Email</label>
            <div class="input-wrapper"><input type="email" id="email" value="john.doe@email.com" disabled></div>
          </div>
          <div class="form-group">
            <label>Phone</label>
            <div class="input-wrapper"><input type="tel" id="phone" value="+1 (555) 123-4567" disabled></div>
          </div>
          <div class="form-group">
            <label>Date of Birth</label>
            <div class="input-wrapper"><input type="date" id="dob" value="1985-06-15" disabled></div>
          </div>
          <div class="form-group full-width">
            <label>Address</label>
            <div class="input-wrapper"><input type="text" id="address" value="123 Main Street, Apt 4B" disabled></div>
          </div>
          <div class="form-group full-width">
            <label>City</label>
            <div class="input-wrapper"><input type="text" id="city" value="New York, NY 10001" disabled></div>
          </div>
        </div>
      </div>

      <!-- Medical Info -->
      <div class="detail-card" id="medicalCard">
        <div class="card-header">
          <div class="card-title"><h2>Medical Information</h2></div>
          <div class="button-group" id="medicalButtons">
            <button class="edit-btn" onclick="enableEdit('medical')">Edit</button>
          </div>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label>Blood Type</label>
            <div class="input-wrapper"><input type="text" id="bloodType" value="O+" disabled></div>
          </div>
          <div class="form-group full-width">
            <label>Allergies</label>
            <div class="input-wrapper"><input type="text" id="allergies" value="Peanuts" disabled></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="profile.js"></script>
</body>
</html>
